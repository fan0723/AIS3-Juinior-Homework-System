{% extends "base.html" %}
{% block title %}設定新密碼{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card login-card">
    <h2>首次登入：請設定新密碼</h2>
    <p class="muted">帳號：{{ user.email }}。初始密碼僅能用於設定新密碼；完成後初始密碼立即失效，並需以新密碼重新登入。</p>
    {% for e in errors %}<div class="alert bad">{{ e }}</div>{% endfor %}
    <form method="post" action="/change-initial-password">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label>目前（初始）密碼</label><input type="password" name="current_password" required autocomplete="current-password">
      <label>新密碼</label><input type="password" name="new_password" required minlength="10" autocomplete="new-password">
      <div class="help">至少 10 字元、不可只有數字、不可與初始密碼相同、避免常見密碼。</div>
      <label>再次輸入新密碼</label><input type="password" name="confirm_password" required minlength="10" autocomplete="new-password">
      <div class="actions"><button type="submit">更新密碼</button></div>
    </form>
    <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="secondary small" type="submit">登出</button></form>
  </div>
</div>
{% endblock %}
