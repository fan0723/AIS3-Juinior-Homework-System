{% extends "base.html" %}
{% block title %}設定兩步驟驗證{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
  <h2>設定兩步驟驗證（TOTP）</h2>
  {% if required %}<div class="alert warn">管理員帳號必須先啟用兩步驟驗證，才能使用管理後台。</div>{% endif %}
  {% if error %}<div class="alert bad">{{ error }}</div>{% endif %}
  <ol>
    <li>以驗證器 App 掃描下方 QR Code（或手動輸入金鑰）。</li>
    <li>輸入 App 顯示的 6 位數驗證碼完成綁定。</li>
  </ol>
  <img src="{{ qr }}" alt="TOTP QR code" width="220" height="220" style="background:#fff;padding:8px;border-radius:8px">
  <p>手動金鑰：<span class="mono">{{ secret }}</span></p>
  <form method="post" action="/mfa/setup">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>驗證碼</label>
    <input type="text" name="code" inputmode="numeric" maxlength="7" autocomplete="one-time-code" required style="max-width:200px">
    <div class="actions"><button type="submit">啟用</button></div>
  </form>
</div>
{% endblock %}
